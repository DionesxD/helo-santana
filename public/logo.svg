<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo placeholder — Bia Lima Manicure
     Substitua este arquivo por um logo profissional quando disponível.
     Paleta: Coral Rosa #D85A78, Bordô #B23A5C, Rosa Claro #F2B6C6
     Tamanho recomendado do substituto: 512x512 SVG ou PNG -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D85A78"/>
      <stop offset="100%" stop-color="#B23A5C"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#FFFBF8" stroke="#F2B6C6" stroke-width="2"/>

  <!-- Frasco de esmalte estilizado -->
  <!-- Corpo do frasco -->
  <path d="M42 52 Q42 44 50 44 L70 44 Q78 44 78 52 L78 88 Q78 98 68 98 L52 98 Q42 98 42 88 Z"
        fill="url(#grad)"/>

  <!-- Pescoço do frasco -->
  <rect x="52" y="32" width="16" height="14" rx="2" fill="#B23A5C"/>

  <!-- Tampa -->
  <rect x="50" y="20" width="20" height="14" rx="3" fill="#2E2422"/>

  <!-- Pincel (saído do frasco) -->
  <rect x="58" y="8" width="4" height="14" fill="#2E2422"/>
  <rect x="56" y="4" width="8" height="6" rx="2" fill="#F2B6C6"/>

  <!-- Brilho no frasco -->
  <ellipse cx="52" cy="62" rx="3" ry="14" fill="#FFFFFF" opacity="0.25"/>

  <!-- Gota de esmalte decorativa -->
  <circle cx="96" cy="96" r="6" fill="#D85A78" opacity="0.4"/>
  <circle cx="24" cy="100" r="4" fill="#F2B6C6" opacity="0.6"/>
</svg>
